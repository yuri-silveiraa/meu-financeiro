<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de fundo moderno -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Brilho no topo -->
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Faceta Superior Central -->
    <linearGradient id="topCenter" x1="24" y1="18" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Faceta Inferior Central -->
    <linearGradient id="bottomCenter" x1="32" y1="28" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Facetas Laterais -->
    <linearGradient id="sideLeft" x1="16" y1="24" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sideRight" x1="48" y1="24" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Base com cantos arredondados (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#innerGlow)" stroke-width="2" />

  <!-- Diamante / Gem Financeira -->
  <g id="gem" transform="translate(0, 1)">
    <!-- Faceta Superior Esquerda -->
    <polygon points="16,26 24,18 24,28" fill="#e0f2fe" />
    
    <!-- Faceta Superior Central -->
    <polygon points="24,18 40,18 36,28 28,28" fill="url(#topCenter)" />
    
    <!-- Faceta Superior Direita -->
    <polygon points="40,18 48,26 40,28" fill="#7dd3fc" />
    
    <!-- Faceta Média Esquerda -->
    <polygon points="16,26 24,28 32,48" fill="url(#sideLeft)" />
    
    <!-- Faceta Média Central (Triângulo Invertido Principal) -->
    <polygon points="24,28 40,28 32,48" fill="url(#bottomCenter)" />
    
    <!-- Faceta Média Direita -->
    <polygon points="40,28 48,26 32,48" fill="url(#sideRight)" />
    
    <!-- Linhas de contorno brilhante sutil -->
    <polyline points="16,26 24,18 40,18 48,26 32,48 16,26" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <line x1="24" y1="28" x2="40" y2="28" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="24" y1="28" x2="32" y2="48" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="40" y1="28" x2="32" y2="48" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Ponto de Brilho / Sparkle Superior Direito -->
  <path d="M46 14 C46 16.5 44 18 41 18 C44 18 46 19.5 46 22 C46 19.5 48 18 51 18 C48 18 46 16.5 46 14 Z" fill="#ffffff" opacity="0.95" />
</svg>
